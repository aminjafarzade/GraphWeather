  max_epochs: 2
  max_train_batches: 2
  max_valid_batches: 2
  batch_size: 2
  num_data_workers: 0
  hidden_dim: 32
  num_heads: 4
  encoder_blocks: 1
  decoder_blocks: 1
  l0_blocks: 1
  l1_blocks: 1
  l2_blocks: 1
  l1_refine_blocks: 1
  l0_refine_blocks: 1
  max_rollout_steps: 2
  rollout_schedule: [1, 2]
  rollout_stage_epochs: [1, 1]
  valid_rollout_steps: 1
