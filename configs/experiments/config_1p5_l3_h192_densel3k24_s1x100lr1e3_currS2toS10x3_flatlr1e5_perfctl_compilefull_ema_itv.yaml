# S1-PEAK-LR 1e-3 VARIANT of the 1p5 dense h192 L3 run (peak/20 rule ->
# min_lr 5.0e-05), mirroring the established 2p5 arm
#   config_2p5_l3_hidden160_s1x100_lr1e3_currS2toS10x3_*.yaml (lr 0.001 / min 5e-05).
# Curriculum stays flat 1.0e-05. Everything else identical to the lr5e4 twin,
# so the head-to-head isolates the S1 peak LR.
# 1.5-DEGREE DENSE-GRID (row-aware kNN + dense L3 k24) h192, ONE config: S1 x100 @ peak 5.0e-4, then S2..S10 x3 @ flat 1.0e-5.
#
# Copied from the 2.5-degree h192 twin
#   config_2p5_l3_hidden192_s1x100_lr5e4_currS2toS10x3_flatlr1e6_dense_l3k24_perfctl_compilefull_ema_itv.yaml
# with ONLY the resolution-coupled facts changed. Same recipe otherwise:
# width 192 at every level (uniform hidden_dim, 6 heads / head_dim 32), EMA,
# itv channel weighting (itv_exponent 1.0), NO spectral loss, edge-projection
# cache, full compile, batch 12, warmup 8, max_epochs 127 (100 S1 + 9x3 curr).
#
# WHAT IS DIFFERENT FROM THE 2p5 TWIN:
#   1. DATA: /raid/common/era_1p5 (WeatherBench-2 ERA5 1.5-deg daily, 240x121
#      equiangular WITH POLES, conservative regrid; train 1981-2015, valid
#      2016-2017, test 2018). 75 channels in the file's own grouped order
#      (z q t u v at 13 levels 50..1000 -- includes 150/250, NO 800 level --
#      then t2m u10 v10 skt sp msl tcwv tisr tp orog). in_channels/out_channels
#      are 0..74 IN THAT ORDER; names resolve from the NetCDF channel_names, so
#      do not reorder these lists.
#   2. CURRICULUM LR: flat 1.0e-05 (not the 2p5 twin's 1.0e-06). Motivated by
#      the initckptS1 lr1e5 experiment on the 2p5 HEALPix arm.
#   3. TARGETS, as always: orog copied (never predicted), tisr known-future;
#      both excluded from the loss. tp is a normal predicted channel.
#   4. delta stats: data/stats/era5_75_1p5_delta_stats.npz -- does not exist
#      yet; the trainer computes it from the train split on first run.
#   5. graph: NEW path (auto-built). The old graphs/graph_1p5_121x240_* bundles
#      belong to the retired kai_1p5 dataset (different coordinates/stats) and
#      are deliberately not reused.
#   6. GRID: 121x240 pole-inclusive (29,040 cells). Dense-L3 hierarchy
#      121x240 / 61x120 / 31x60 / 16x30 with level_k [8,8,8,24], row-aware kNN,
#      exactly like the 2p5 dense arm.
#
# SCORING: itv reweights the objective, so valid_* is comparable to other *_itv
# runs but NOT to non-itv ones. Rank on evaluation RMSE/ACC.
