# hidden-160 + itv, s1x150 @ peak 5.0e-4 + S2..S10 x3 @ flat 1.0e-6 -- BATCH 24.
#
# Single change from config_..._s1x150_lr5e4_currS2toS10x3_..._ema_itv:
#   batch_size 12 -> 24 (top level AND resolution_profiles.2p5, which overrides it).
#   gradient_accumulation_steps stays 1, so this is a TRUE batch of 24, not accumulation.
#   Learning rate is deliberately LEFT at peak 5.0e-4 / min 2.5e-5, as requested.
#
# READ THIS BEFORE COMPARING IT TO THE BATCH-12 RUN.
# Doubling the batch HALVES the optimizer steps per epoch: 1120 -> ~560 (measured on the
# batch-12 run). The cosine schedule still spans 150 S1 epochs, so the model sees the same
# samples but takes half as many updates, each with roughly half the gradient noise. At an
# unchanged peak LR that is strictly less total parameter movement, so this run is likely
# to UNDERFIT relative to batch 12 rather than match it.
#   * For a clean batch-size ablation at fixed LR, that is the correct setup -- keep as is.
#   * To make batch 24 the compute-equivalent of batch 12, apply the linear scaling rule:
#     set lr and rollout_stage_lr_schedule[0].max_lr to 1.0e-3 and min_lr to 5.0e-5.
#     1.0e-3 is smoke-tested elsewhere in this repo but is NOT verified over a full run;
#     if you scale, also raise S1 warmup_epochs from 5 to 8.
#     A milder option is sqrt scaling: 7.1e-4 peak / 3.5e-5 min.
#
# MEMORY: measured peak at batch 12 was 5.3 GB at S1 rising to 47.3 GB at S10. Activation
# memory is ~linear in batch, so expect ~10.6 GB at S1 and ~95 GB at S10, against 183 GB on
# a B200. It fits with roughly 1.9x headroom, but S10 will not co-exist with another large
# job on the same GPU -- give this run a GPU to itself for the curriculum stages.
#
# WHY BOTHER: larger batches usually raise GPU utilisation, so wall-clock per epoch should
# drop even though each epoch does half the updates.
#
# SCORING: itv reweights the objective, so valid_* compares only to the other *_itv runs.
# Rank on evaluation RMSE/ACC, read all-65 median AND mean, and check sp explicitly.
