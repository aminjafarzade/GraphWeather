    l2_blocks: 1
    l3_blocks: 1
    l2_refine_after_l3_blocks: 1
    l1_refine_blocks: 1
    l0_refine_blocks: 1
    skip_fusion:
      type: default
      init_scale: 1.0
      max_scale: 2.0
    pooling:
