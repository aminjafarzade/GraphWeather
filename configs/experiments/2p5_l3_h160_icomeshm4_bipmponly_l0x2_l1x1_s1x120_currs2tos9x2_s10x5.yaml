# 2.5-degree GraphCast-style grid<->M4 icosphere experiment.
# L0..L3 are native M4/M3/M2/M1 meshes: 2562/642/162/42 nodes.
# Coarsest mixing decision: keep native M1 degree-5/6 connectivity and rely on
# U-Net depth; no extra long-range edges are added.
# BipartiteMP performs grid<->mesh transfer; the Graph U-Net performs all mesh
# processing, with no redundant outer encoder or decoder attention blocks.
# Scale-matched encoder depth: two M4/L0 blocks and one M3/L1 block.
2p5_l3_h160_icomeshm4_bipmponly_l0x2_l1x1_s1x120_currs2tos9x2_s10x5: &m4_sum_base
  lr: 1.0e-4
  min_lr: 1.0e-6
  weight_decay: 1.0e-4
  scheduler: CosineAnnealingLR
  max_epochs: 141
  max_train_batches: null
  max_valid_batches: null
  batch_size: 6
  gradient_accumulation_steps: 2
  num_data_workers: 8
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  enable_amp: true
  amp_dtype: auto_bf16_fp16
  max_gradient_norm: 0.5
  log_cuda_memory: true
  log_every_batches: 1000

  experiment_name: 2p5_l3_h160_icomeshm4_bipmponly_l0x2_l1x1_s1x120_currs2tos9x2_s10x5
