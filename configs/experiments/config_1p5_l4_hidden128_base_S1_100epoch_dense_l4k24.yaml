# 1.5-degree (121x240 = 29040 nodes, poles included) S1-only base pretrain,
# 5-level Graph U-Net (standard ceil-halving pyramid 121x240 -> 61x120 -> 31x60
# -> 16x30 -> 8x15), hidden 128 (4 heads x head_dim 32). k=8 at every level,
# dense k=24 only at the coarsest L4 (~same physical scale as the proven 2p5 L3).
# Port of config_1p5_l3_hidden128_base_S1_100epoch_dense_l3k24.yaml to 5 levels.
# The graph graphs/graph_1p5_121x240_k8_levelk8-8-8-8-24_hybrid_row_aware_L4_v5.pt
# is auto-built from the training file's own lat/lon on first run
# (auto_build_graph: true); delta stats are auto-computed if the npz is missing.
