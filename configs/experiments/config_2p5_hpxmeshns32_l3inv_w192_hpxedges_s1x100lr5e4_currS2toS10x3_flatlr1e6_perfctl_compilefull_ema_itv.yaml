# HEALPix nside-32 mesh + INVERTED channels 192 / 96 / 48 / 24, + itv, + EMA.
# S1 x100 @ peak 5.0e-4 -> 2.5e-5, then S2..S10 x3 @ flat 1.0e-6. 127 epochs, batch 12.
#
# This is config_2p5_hpxmeshns32_l3_h192_hpxedges_..._ema_itv.yaml with ONE change:
#   level_dims  (absent -> uniform 192) -> [192, 96, 48, 24]
#   level_heads (absent -> uniform 6)   -> [6, 6, 6, 6]
# The grid->HEALPix path is untouched: mesh_encoder.boundary_type stays fixed_spherical,
# i.e. src/models.py:391 builds FixedBipartiteRemap for BOTH directions -- a fixed,
# parameter-free conservative interpolation. No BipartiteMP, no learned message passing
# across the grid<->mesh boundary. Graph cache, itv, EMA, curriculum, LR table, substrate
# and every other field are identical to the flat-192 HEALPix run, so the pair isolates
# the inverted channels exactly.
#
# HOW IT COMPOSES: grid features are embedded at 192, interpolated onto the HEALPix L0
# mesh at 192, and only then does the U-Net taper 192 -> 96 -> 48 -> 24 as the mesh
# coarsens, widening back on the way up before being interpolated home. Because
# FixedBipartiteRemap is channel-independent, the interpolation is unaffected by the
# taper -- it carries whatever width L0 holds.
#
# REQUIRES a one-line relaxation in src/models.py (this branch): the mesh guard used to
# demand every level equal hidden_dim, which blocked tapered widths on mesh graphs for no
# architectural reason -- GraphUNetProcessor already projects between differing widths via
# MeanMaxPool(out_dim=...) and ParentUnpoolFuse(coarse_dim=...). The guard now checks only
# level_dims[0] == hidden_dim, which is the real constraint (the transfer lands on L0).
# Uniform-width mesh configs are unaffected.
#
# HEADS: 192/96/48/24 are all divisible by 6, giving per-level head_dim 32/16/8/4 --
# the same pattern as the dense-grid inverted configs.
#
# SCORING: itv reweights the objective, so valid_* compares only to other *_itv runs.
# Rank on evaluation RMSE/ACC, read all-65 median AND mean together, and check sp.
