# HORIZON-ONLY training + SPECTRAL POWER-MATCHING loss, warm started from the
# HEALPix-mesh S1 base.
#
# Loads epoch 100 of
#   runs/2p5_hpxmeshns32_l3_h160_hpxedges_s1x100lr5e4_currS2toS10x3_flatlr1e6_perfctl_compilefull_ema_itv/best_ckpt_S1.tar
# and runs ONLY the S2..S10 curriculum (9 stages x 3 epochs = 27 epochs) at a flat
# 1.0e-05. Fresh optimizer, scheduler and epoch counter -- trainer.initialize_from_checkpoint
# loads weights only. EMA note: the checkpoint's `model_state` holds the EMA SHADOW
# weights, so the warm start begins from the EMA average; optimizer/scheduler/EMA
# state are NOT carried over.
#
# WHAT THIS CHANGES vs 2p5_hpxmeshns32_l3_h160_hpxedges_initckptS1_currS2toS10x3_lr1e5_ema_itv
# (same S1 base, same 9 stages x 3 epochs, same flat 1e-5, same EMA/ITV/data/graph):
#   spectral_loss: NEW power_match mode, weight 0.05, on u850/v850/msl/q700,
#   band_weights low 0 / mid 1 / high 1.
# A head-to-head against that run isolates the spectral term alone.
#
# WHY: the parent family loses small-scale variance by day 10 (variance ratios
# u850 ~0.81, msl ~0.85 in diagnostics_full_eval) -- MSE-driven blur. The old
# error_low_k spectral mode cannot address this (it penalizes low-k ERROR power;
# a blurred forecast scores exactly 0), and a high-k error-power term would make
# blur worse (under unpredictable phase, damping amplitude halves the error).
# power_match compares prediction and target band POWER separately, so it demands
# realistic small-scale energy without punishing phase uncertainty. See
# src/losses.py:band_spectral_power_loss and tests/test_spectral_power_loss.py.
#
# SUCCESS CRITERIA (vs the non-specpm twin): day-10 variance ratio for
# u850/msl/q700 moves toward 1.0; evaluation day-10 RMSE/ACC not worse; day-1..3
# RMSE not worse. If variance improves but RMSE regresses, halve the weight.
#
# resume: true is kept and is safe: restore_checkpoint only wins when this run's OWN
# ckpt.tar exists, so the warm start applies on a fresh launch and an interrupted run
# still continues from itself.
#
# SCORING: itv reweights the objective, so valid_* is comparable to the other *_itv
# runs but NOT to the non-itv ones. Rank on evaluation RMSE/ACC.
2p5_hpxmeshns32_l3_h160_hpxedges_initckptS1_currS2toS10x3_lr1e5_ema_itv_specpm:
  lr: 1.0e-05
  min_lr: 1.0e-05
  weight_decay: 0.0001
  scheduler: CosineAnnealingLR
  max_epochs: 27
  max_train_batches: null
  max_valid_batches: null
  batch_size: 12
  gradient_accumulation_steps: 1
  num_data_workers: 8
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  enable_amp: true
  amp_dtype: auto_bf16_fp16
  max_gradient_norm: 0.5
  log_cuda_memory: true
  # Band-wise spectral POWER-MATCHING loss (mode: power_match). Unlike the old
  # error_low_k mode -- which penalizes low-wavenumber ERROR power, is exactly
  # blind to blur (a low-passed forecast scores 0), and at high-k would reward
  # amplitude damping under unpredictable phase -- this transforms prediction
  # and target separately and matches per-band log power, so missing small-scale
  # variance is penalized and phase-wrong-but-amplitude-right is not.
  # Bands = equal thirds of the radial-wavenumber axis, identical to the
  # diagnostics low_k/mid_k/high_k split (see tests/test_spectral_power_loss.py).
  # Variables = the channels with a measured day-10 variance deficit on the
  # parent family (u850 ~0.81, msl ~0.85, q700 ~0.94; v850 included as u850's
  # pair). z500/t2m/t850 sit at ~1.0 and are left alone.
  # Weight 0.05 is a regularizer scale: log-power units are O(0.01-0.1) once
  # bands are only mildly off, so the term nudges rather than dominates.
  spectral_loss:
    enabled: true
    mode: power_match
    weight: 0.05
    variables:
    - u850
    - v850
    - msl
    - q700
    band_weights:
      low_k: 0.0
      mid_k: 1.0
      high_k: 1.0
    apply_latitude_weight: true
    space: normalized
  experiment_name: 2p5_hpxmeshns32_l3_h160_hpxedges_initckptS1_currS2toS10x3_lr1e5_ema_itv_specpm
