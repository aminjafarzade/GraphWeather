# INVERTED-CHANNEL L4 on the 1.5-degree GRID: widths 256/128/64/32/32 + itv + ema.
#
# Copied from the plain L4 twin (config_1p5_l4_h192_densel4k24_s1x100lr5e4_*.yaml)
# with, following the 2p5 l3inv convention (config_2p5_l3inv_w224_*.yaml):
#   hidden_dim  192 -> 256           (must equal level_dims[0])
#   level_dims  uniform 192 -> [256, 128, 64, 32, 32]   (halving, floored at 32)
#   level_heads [8, 8, 8, 4, 4] (num_heads 8 at L0): per-level head_dim 32/16/8/8/8;
#     models.py requires level_dims[i] % level_heads[i] == 0 at every level -- holds.
#   BLOCK COUNTS UNCHANGED on purpose: the l3inv configs use the same
#     l0:2 l1:2 l2:1 l3:1 (+refine 1s, l4:1) block counts as the plain arms --
#     inversion changes widths and heads only.
#   S1 peak LR 5e-4 -> 1e-3 (min = peak/20 = 5.0e-05), curriculum unchanged at
#     flat 1.0e-05, 3 epochs per horizon S2..S10; 100-epoch S1; EMA + itv as in
#     every *_ema_itv arm; checkpoint_rollout_steps stays true (1p5 OOM fix).
#
# "INVERTED" = width HALVES as the graph coarsens (L0 256 -> L4 32), opposite of
# the uniform-width arms. level_dims is incompatible with mesh_encoder.enabled --
# this is the GRID arm only.
#
# SCORING: itv reweights the objective; valid_* comparable only to other *_itv
# runs. Rank on evaluation RMSE/ACC.
