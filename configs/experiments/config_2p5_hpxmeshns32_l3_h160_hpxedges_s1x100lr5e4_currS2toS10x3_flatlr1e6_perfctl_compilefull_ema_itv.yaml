# HEALPix-MESH run: lat-lon data in, HEALPix mesh inside the model, lat-lon out.
# Derived from the best 2.5 deg run,
#   config_2p5_l3_hidden160_s1x100_lr1e3_currS2toS10x3_flatlr1e6_dense_l3k24_perfctl_compilefull_ema_itv.yaml
#
# WHAT CHANGED, and nothing else:
#   1. SUBSTRATE  lat-lon kNN L0 -> HEALPix nside 32 mesh, reached by a FIXED
#      conservative area-weighted regrid (mesh_encoder.mesh_type: healpix,
#      boundary_type: fixed_spherical). node_counts, edge_counts, graph_path and
#      mesh_format_version follow from that.
#   2. EDGES      level_k_neighbors [8, 8, 8, 24] -> [8, 8, 8, 8]. Every level now
#      uses TRUE HEALPix adjacency: the 8 geometric neighbours of each pixel, with
#      the 24 degree-7 pixels (where only three base faces meet) self-padded and
#      masked out of the attention softmax. The baseline's dense k=24 coarsest level
#      is gone: on a HEALPix mesh that level could only be built by spherical kNN,
#      which is not HEALPix connectivity.
#   3. LR         peak 1.0e-3 -> 5.0e-4, min 5.0e-5 -> 2.5e-5 (peak/20, the
#      convention in this family). Set in BOTH the top-level lr/min_lr AND
#      rollout_stage_lr_schedule[S=1] -- lr_schedule_type is
#      rollout_stage_warmup_cosine, so the STAGE entry is what the scheduler reads
#      and a top-level-only edit would silently keep training at the old LR.
#
# IDENTICAL to the baseline: EMA (decay 0.999), ITV loss weighting, the 100 + 27 =
# 127 epoch S1 + S2..S10x3 curriculum at flat 1.0e-6, weight_decay 1e-4,
# CosineAnnealingLR, clip 0.5, batch 12 / accum 1, AMP auto_bf16_fp16, compile scope
# full, edge projection cache, attention impl, hidden 160 / 5 heads / head_dim 32 and
# every block count. Enforced by tests/test_healpix_mesh.py.
#
# 8 warmup epochs are kept from the baseline. Those were introduced because 1.0e-3 was
# unverified; at 5.0e-4 (which IS verified stable at this batch/clip) a longer warmup
# is strictly conservative, so it is left alone rather than reverted to 5.
#
# THE DATA DOES NOT CHANGE: resolution_mode 2p5, the same [T, C, 72, 144] files, the
# same era5_67_2p5 delta statistics, the same cos(lat) loss weighting, the same
# evaluator. The HEALPix round trip lives entirely inside the model, between
# grid2mesh and mesh2grid, both FIXED parameter-free conservative remaps.
#
# MEASURED ERROR FLOOR -- report this next to any short-lead comparison. Because both
# remaps are fixed, latlon->hpx32->latlon is a smoothing operator the model cannot
# invert. Per-channel round-trip RMSE / field std on ERA5 1979 at 2.5 deg: 0.24% min,
# 3.97% median, 8.28% p90, 12.04% max. At nside 64: 1.84% median / 5.89% max, at 4x
# the mesh nodes -- the lever if the floor binds. Reproduce with:
#   python scripts/regrid_latlon_healpix.py --verify <train file>.nc --nside 32
#
# SCORING: itv reweights the objective, so valid_* is comparable to the other *_itv
# runs but NOT to the non-itv ones. Rank on evaluation RMSE/ACC.
2p5_hpxmeshns32_l3_h160_hpxedges_s1x100lr5e4_currS2toS10x3_flatlr1e6_perfctl_compilefull_ema_itv:
