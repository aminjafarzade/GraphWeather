# 1.5-degree (121x240 = 29040 nodes, poles included) initckpt-style curriculum fine-tune.
# Direct port of the winning 2p5 recipe (dense_l3k24_curriculum_S2toS10_3ep_initckpt):
# warm start from the 1p5 S1-only 100-epoch dense_l3k24 base checkpoint, then
# warmup-cosine LR 5e-5 -> 1e-6 over an S2->S10 rollout curriculum with 3 epochs
# per horizon (27 epochs), checkpoint on valid_S10_final, orog copied and
# excluded from loss, tisr predicted (no known-future forcing).
# Prerequisite: run config_1p5_l3_hidden128_base_S1_100epoch_dense_l3k24.yaml
# first, or point init_from_checkpoint at the 2p5 base
# (runs/s1only_2p5_l3_hidden128_base_100epoch_dense_l3k24/best_ckpt.tar) for a
# cross-resolution warm start - the weights are graph-size independent.
# Graph graphs/graph_1p5_121x240_k8_l3k24_hybrid_row_aware_L3_v4.pt is auto-built on the
# first run; delta stats are auto-computed if the npz does not exist yet.
