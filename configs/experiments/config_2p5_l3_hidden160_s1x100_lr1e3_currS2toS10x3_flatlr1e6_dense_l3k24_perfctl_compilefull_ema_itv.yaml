# hidden-160 + itv, SHORT/FAST recipe: S1 x100 @ peak 1.0e-3, then S2..S10 x3 @ flat 1.0e-6.
# 100 + 27 = 127 epochs -- about 30% cheaper than the s1x150+curr3 run (177 ep).
#
# WHAT CHANGED vs config_..._s1x150_lr5e4_currS2toS10x3_..._ema_itv:
#   S1 epochs 150 -> 100, S1 peak LR 5.0e-4 -> 1.0e-3 (min stays peak/20 = 5.0e-5),
#   S1 warmup 5 -> 8 epochs. Curriculum, itv, EMA, substrate, architecture unchanged.
#
# WHY THE LONGER WARMUP: 5.0e-4 was verified stable at this batch/clip (train loss fell
# monotonically straight through the peak, no spikes, no NaNs). 1.0e-3 is 2x that and is
# NOT verified. 8 warmup epochs at start factor 0.1 ramps 1.0e-4 -> 1.0e-3, so the run
# spends its first epochs at or below the peak that is already known to be safe.
#
# TWO MEASURED CAVEATS, so the result is read correctly:
#  1. A shorter S1 costs skill at EVERY lead. Controlled test on this repo (identical
#     27-epoch curriculum @5e-5, only the S1 base differing): a 200-epoch S1 base beat a
#     100-epoch base by -8.6% day 1, -5.3% day 5, -2.5% day 10, and on 61/65 channels at
#     day 10. Separately, s1x100+curr6 came out +2.18% worse at day 1 than s1x150+curr3.
#     The higher peak LR here is meant to buy some of that back; whether it does is the
#     open question this run answers.
#  2. This differs from the s1x150 run in TWO ways (S1 length and peak LR), so a
#     head-to-head cannot attribute the difference to either one alone.
#
# NOT CHANGED, deliberately: the horizon stages stay at flat 1.0e-6 so this stays
# comparable to the other runs in the series. Note that is a known-suboptimal setting --
# curriculum at 5e-5 cut day1->day2 error amplification by 19.7-21.2 points versus 14.4
# points at 1e-6. That is the single best untested lever and deserves its own run.
#
# SCORING: itv reweights the objective, so valid_* is comparable to the other *_itv runs
# but NOT to the non-itv ones. Rank on evaluation RMSE/ACC, read all-65 median AND mean,
# and check sp explicitly.
