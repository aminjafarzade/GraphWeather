# 1.5 degree L4 hidden-160 curriculum S2->S10, 3 epochs per horizon (27 epochs total),
# warm-started from the 150-epoch S1 base. Only the warm start and the names differ from
# the 100-epoch-base sibling.
#
# Rollout-step checkpointing is OFF (both flags -- src/trainer.py gates on their OR,
# so leaving either true keeps the forward recompute fully on).
# Measured on this exact config, 1.5 degree L4 hidden 160, batch 4 x accum 3:
#   peak GB = 1.28 + 7.56 * rollout_steps   (measured at S1/S2/S5/S10: 8.84 / 16.46 / 39.16 / 76.97)
#   S10 throughput 2.900 samples/s vs 2.162 with checkpointing on -> 1.34x
# REQUIRES a >=96 GB card at S10 (77.28 GB reserved). Does NOT fit a 46 GB L40S beyond S5.
#
# EMA of the weights is ON (decay 0.999). Validation, best-checkpoint selection and the
# saved model_state all use the EMA weights; the live training weights are kept in the
# checkpoint under ema_live_model_state so resume stays exact (src/trainer.py _ema_update,
# _ema_swap_in, _ema_swap_out).
# Decay sizing: the effective batch is 12, so an epoch is ~1120 optimizer steps in the base
# and ~1092 in the curriculum. decay 0.999 averages over ~1000 steps, i.e. just under one
# epoch - long enough to smooth, short enough that after a curriculum stage transition
# (3276 steps per stage) the EMA has re-converged to the new horizon well before the stage
# ends.
