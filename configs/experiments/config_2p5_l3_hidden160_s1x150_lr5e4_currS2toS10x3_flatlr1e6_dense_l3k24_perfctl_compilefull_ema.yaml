      train_data_path: ${GW_DATA_ROOT:-/home/amin/ERA_5_2p5}/era5_67/train
      valid_data_path: ${GW_DATA_ROOT:-/home/amin/ERA_5_2p5}/era5_67/val
      test_dataset_path: ${GW_DATA_ROOT:-/home/amin/ERA_5_2p5}/era5_67/test
      graph_path: graphs/graph_2p5_k8_l3k24_hybrid_row_aware_L3_v4.pt
      global_means_path: ${GW_DATA_ROOT:-/home/amin/ERA_5_2p5}/era5_67/stats/global_mean.npy
      global_stds_path: ${GW_DATA_ROOT:-/home/amin/ERA_5_2p5}/era5_67/stats/global_std.npy
