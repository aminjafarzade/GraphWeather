# hidden-160, ONE config covering both phases: S1 for 200 epochs, then horizons
# 2..10 for 3 epochs each (200+3+... = 227 epochs total).
#
# Execution stack (perf control, numerically equivalent to the CTL's):
#   batch 12 x accum 1 (effective batch 12), edge_projection_cache, attention_impl
#   elementwise, compile_scope full, ema decay 0.999.
#
# THREE arms stacked, copied verbatim from their individual arm configs:
#   edge_gate   model.edge_encoding = rbf_bins 16, bearing_harmonics 2, gate true,
#               bias_mlp_hidden 32. Note this arm is more than the gate: it also
#               expands the edge features and swaps the attention bias for an MLP.
#   pool_nomax  pooling.include_max false AND mean_type area_weighted. The arm is
#               both changes; set mean_type back to `mean` for max-removal alone.
#   lossw_itv   loss_channel_weighting.inverse_tendency_variance.
#
# SUBSTRATE: matches the arm family. Like every config in it (including its own
# control, ..._notisr), this feeds ground-truth tisr at each rollout step rather
# than predicting it, and drops tisr from the scored loss:
#     target_handling.known_future_variables: [tisr]
#     target_handling.exclude_loss_variables: [orog, tisr]
# That differs from the 200-epoch perf-control base, which leaves both empty -- so
# compare this run to the arm family, not to the perf control.
#
# load_only_current_rollout is TRUE on purpose. Trainer._ensure_train_loader_rollout
# rebuilds the train loader at every stage transition, so each stage loads exactly
# the horizon it trains on. With it false, all 227 epochs load 10-step targets --
# including the 200 S1 epochs that use one -- and the trainer sits blocked on the
# dataloader for 83 s of a 145 s epoch. Measured: data_time_sec 83 s -> 0.5 s.
#
# lossw_itv reweights the objective, so valid_S10_final is NOT comparable to the
# unweighted control -- it changes scale, not just quality. Rank this run on the
# all-65-channel evaluation aggregate, median and mean together.
